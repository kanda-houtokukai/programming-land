<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>右カラム 縦予算シミュレータ（1画面完結の判定つき）</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:#2e2237; overflow:hidden;
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    -webkit-user-select:none; user-select:none;}

  /* ==== アプリのヘッダー再現（実寸） ==== */
  header{display:flex; align-items:center; gap:10px; padding:10px 16px; background:#241a2c; color:#f5eddf;}
  header .mark{width:30px;height:30px;border-radius:8px;background:#f2b23a;flex-shrink:0;}
  header h1{font-size:15px;font-weight:900;letter-spacing:.06em;margin:0;}
  header .sub{font-size:11px;opacity:.65;font-weight:500;}

  .wrap{display:flex; height:calc(100% - 56px);}
  .lpane{flex:1 1 0; background:#f3f6fa; border-right:1px solid #dbe2ea;
    display:flex; align-items:center; justify-content:center; color:#aab4c0; font-size:12px; font-weight:900;}
  .right{background:#f3f6fa; border-left:1px solid #dbe2ea; padding:10px 12px 10px;
    overflow:hidden; flex:0 0 auto;}

  .theater{position:relative; width:100%; aspect-ratio:3/2; border-radius:15px;
    border:4px solid #241a2c; background:#1c1424; overflow:hidden;
    box-shadow:inset 0 0 0 3px #fff, 0 6px 16px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center;}
  .theater .g{position:absolute; inset:0;
    background-image:linear-gradient(#ffffff22 1px,transparent 1px),linear-gradient(90deg,#ffffff22 1px,transparent 1px);}
  .theater .lb{position:relative; color:#8d7fa0; font-size:12px; font-weight:900;}

  .card{background:#fff; border:1px solid #dbe2ea; border-radius:13px; padding:11px 12px;
    margin-top:12px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .rowtitle{color:#5b6675; font-size:11px; font-weight:900; letter-spacing:.08em; margin-bottom:4px;}

  /* ==== せってい: 現行 ==== */
  .cur .gc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cur .gc-row+.gc-row{margin-top:7px;}
  .cur .gc-toggle,.cur .gc-seg{font-family:inherit;font-weight:900;font-size:12px;background:#eef2f7;
    color:#33404f;border:1px solid #dbe2ea;border-radius:999px;padding:7px 13px;}
  .cur .gc-toggle.on,.cur .gc-seg.on{background:#58a839;color:#fff;border-color:#58a839;}
  .cur .gc-cap{font-size:12px;font-weight:900;}
  .cur .gc-goal{display:inline-flex;align-items:center;gap:7px;background:#f1f4f8;border-radius:999px;
    padding:4px 10px;font-size:12px;font-weight:900;}
  .cur .gc-num{color:#b8860b;font-size:14px;}
  .cur .gc-step{width:26px;height:26px;border-radius:50%;border:none;background:#4a7fc9;color:#fff;font-weight:900;}
  .cur .gc-bomb{width:38px;height:38px;border-radius:10px;border:2px solid #dbe2ea;background:#eef2f7;font-size:20px;}
  .cur .gc-bomb.on{border-color:#e0704f;background:#fdeee9;}

  /* ==== せってい: 案1 / 案1C 共通部品 ==== */
  .q{font-size:14px;font-weight:900;color:#33404f;display:flex;align-items:center;gap:6px;}
  .sw{display:inline-flex;align-items:center;gap:8px;}
  .sw .track{width:56px;height:30px;border-radius:999px;background:#c9d3de;position:relative;flex:0 0 auto;}
  .sw .thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .sw.on .track{background:#58a839;} .sw.on .thumb{left:29px;}
  .sw .state{font-size:12px;font-weight:900;color:#8b98a8;min-width:28px;}
  .sw.on .state{color:#3f7d28;}
  .picks{display:flex;gap:6px;}
  .pick{min-height:40px;border-radius:11px;border:2px solid #dbe2ea;background:#f7f9fc;padding:0 11px;
    display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:900;font-size:12px;
    color:#5b6675;position:relative;white-space:nowrap;}
  .pick .pi{font-size:17px;}
  .pick.on{border-color:#58a839;background:#eaf6e4;color:#2f6b1f;}
  .pick.on::after{content:"✓";position:absolute;top:-7px;right:-5px;width:19px;height:19px;border-radius:50%;
    background:#58a839;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .nest{border-left:4px solid #cfe0c4;background:#f6faf3;border-radius:0 9px 9px 0;padding:6px 10px;}
  .sent{font-size:14px;font-weight:900;color:#33404f;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .stepper{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #dbe2ea;
    border-radius:999px;padding:2px 4px;}
  .stepper b{width:32px;height:32px;border-radius:50%;background:#4a7fc9;color:#fff;font-size:17px;
    display:flex;align-items:center;justify-content:center;}
  .stepper .val{min-width:40px;text-align:center;font-size:17px;color:#b8860b;}
  .ch{width:42px;height:42px;border-radius:10px;border:2px solid #dbe2ea;background:#f7f9fc;font-size:22px;
    display:flex;align-items:center;justify-content:center;position:relative;}
  .ch.on{border-color:#e0704f;background:#fdeee9;}
  .ch.on::after{content:"💣";position:absolute;right:-6px;top:-8px;font-size:14px;}
  .hint{font-size:11px;color:#8b98a8;}
  .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .line+.line{margin-top:8px;}
  .sep{height:1px;background:#e7ecf2;margin:9px 0;}

  /* ==== ぶたい ==== */
  .thumbs{display:flex;gap:7px;}
  .th{flex:1 1 0;border-radius:9px;border:2px solid #dbe2ea;overflow:hidden;background:#dbe6f2;
    height:52px;display:flex;align-items:flex-end;justify-content:center;}
  .th span{font-size:10px;font-weight:900;color:#fff;background:rgba(0,0,0,.45);width:100%;text-align:center;}
  .th.on{border-color:#f2b23a;}
  .chips{display:flex;gap:6px;}
  .chip{height:34px;border-radius:999px;border:2px solid #dbe2ea;background:#f7f9fc;padding:0 10px;
    display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:#5b6675;white-space:nowrap;}
  .chip.on{border-color:#f2b23a;background:#fdf3dd;color:#8a6516;}
  .chip i{width:16px;height:16px;border-radius:4px;background:#9fc6e8;display:block;}

  /* ==== はいゆう ==== */
  .strip{display:flex;gap:7px;background:#eef2f7;border-radius:10px;padding:6px;}
  .cc{width:40px;height:40px;border-radius:9px;background:#fff;border:1px solid #dbe2ea;font-size:21px;
    display:flex;align-items:center;justify-content:center;}

  /* ==== 判定バッジ・つまみ ==== */
  .badge{position:fixed;right:10px;top:64px;z-index:60;border-radius:12px;padding:8px 12px;
    font-size:12px;font-weight:900;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:260px;}
  .badge.ok{background:#dff3d6;color:#2f6b1f;border:2px solid #58a839;}
  .badge.ng{background:#fde3dc;color:#a3341f;border:2px solid #e0704f;}
  .badge small{display:block;font-weight:700;opacity:.8;font-size:11px;margin-top:3px;}
  .ctl{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(20,14,26,.94);color:#f5eddf;
    padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .ctl.hide{transform:translateY(calc(100% - 30px));}
  .ctl b{font-size:11px;opacity:.75;letter-spacing:.05em;}
  .ctl button{font-family:inherit;font-weight:900;font-size:12px;color:#f5eddf;background:#4a3a58;
    border:none;border-radius:999px;padding:6px 12px;}
  .ctl button.on{background:#58a839;}
  .ctl .hd{margin-left:auto;background:#7a4a2a;}
</style>
</head>
<body>

<header>
  <div class="mark"></div>
  <div><h1>ゲームこうぼう</h1><div class="sub">つくって ▶で あそぼう</div></div>
</header>

<div class="wrap">
  <div class="lpane">（こうぐだな＋さぎょうエリア）</div>
  <div class="right" id="right">
    <div class="theater" id="th"><div class="g" id="grid"></div><div class="lb">12×8 の ぶたい</div></div>
    <div id="cfg"></div>
    <div id="bg"></div>
    <div id="cast"></div>
  </div>
</div>

<div class="badge ok" id="badge">—</div>

<div class="ctl" id="ctl">
  <b>せってい</b>
  <button data-k="cfg" data-v="cur">現行</button>
  <button data-k="cfg" data-v="p1">案1</button>
  <button data-k="cfg" data-v="p1c" class="on">案1C ぎっしり</button>
  <b>ぶたい</b>
  <button data-k="bg" data-v="big" class="on">大サムネ</button>
  <button data-k="bg" data-v="chip">チップ列</button>
  <b>はいゆうの説明</b>
  <button data-k="cast" data-v="long" class="on">いまの長文</button>
  <button data-k="cast" data-v="short">みじかく</button>
  <b>ならび</b>
  <button data-k="ord" data-v="now" class="on">せってい が上</button>
  <button data-k="ord" data-v="low">せってい を下</button>
  <button class="hd" id="hd">つまみを たたむ</button>
</div>

<script>
const S={cfg:"p1c", bg:"big", cast:"long", ord:"now"};
const CH=[{c:"c1",e:"🧒"},{c:"c2",e:"🐲"},{c:"c3",e:"🔥"},{c:"c4",e:"🍄"}];
const $=i=>document.getElementById(i);

function cfgCur(){return `<div class="card cur">
  <div class="rowtitle">ゲームの せってい</div>
  <div class="gc-row"><button class="gc-toggle on">スコアを だす ◯</button></div>
  <div class="gc-row"><span class="gc-cap">クリア:</span>
    <button class="gc-seg on">スコア</button><button class="gc-seg">じかん</button><button class="gc-seg">なし</button></div>
  <div class="gc-row"><span class="gc-goal"><button class="gc-step">−</button>
    <span class="gc-num">⭐10</span> たまったら<button class="gc-step">＋</button></span></div>
  <div class="gc-row"><button class="gc-toggle on">ばくだんタッチ ◯</button>
    ${CH.map(c=>`<button class="gc-bomb${c.c==="c2"?" on":""}">${c.e}</button>`).join("")}</div>
</div>`;}

function cfgP1(){return `
<div class="card"><div class="rowtitle">ゲームの ルール</div>
  <div class="q"><span>🏁</span>どうなったら クリア？</div>
  <div class="picks" style="margin-top:8px">
    <div class="pick on" style="flex:1;justify-content:center;min-height:58px;flex-direction:column;gap:2px"><span class="pi" style="font-size:21px">⭐</span>スコア</div>
    <div class="pick" style="flex:1;justify-content:center;min-height:58px;flex-direction:column;gap:2px"><span class="pi" style="font-size:21px">⏱</span>じかん</div>
    <div class="pick" style="flex:1;justify-content:center;min-height:58px;flex-direction:column;gap:2px"><span class="pi" style="font-size:21px">🎈</span>なし</div>
  </div>
  <div class="nest" style="margin-top:10px;margin-left:10px;padding:10px 12px">
    <div class="sent">⭐を <span class="stepper"><b>−</b><span class="val">10</span><b>＋</b></span> こ あつめたら クリア！</div></div>
</div>
<div class="card"><div class="q"><span>💣</span>さわったら おしまい</div>
  <div class="sw on" style="margin-top:6px"><span class="track"><span class="thumb"></span></span><span class="state">オン</span></div>
  <div style="margin-top:9px"><div class="hint" style="margin-bottom:6px">だれが ばくだん？</div>
    <div class="line" style="gap:9px">${CH.map(c=>`<div class="ch${c.c==="c2"?" on":""}" style="width:50px;height:50px">${c.e}</div>`).join("")}</div></div>
</div>
<div class="card"><div class="q"><span>🔢</span>スコアを がめんに だす</div>
  <div class="sw on" style="margin-top:6px"><span class="track"><span class="thumb"></span></span><span class="state">オン</span></div>
</div>`;}

function cfgP1C(){return `<div class="card">
  <div class="rowtitle">ゲームの ルール</div>
  <div class="line">
    <div class="q" style="flex:0 0 auto">🏁 クリア</div>
    <div class="picks" style="flex:1 1 0">
      <div class="pick on" style="flex:1 1 0;justify-content:center"><span class="pi">⭐</span>スコア</div>
      <div class="pick" style="flex:1 1 0;justify-content:center"><span class="pi">⏱</span>じかん</div>
      <div class="pick" style="flex:1 1 0;justify-content:center"><span class="pi">🎈</span>なし</div>
    </div>
  </div>
  <div class="line" style="margin-top:7px"><div class="nest" style="flex:1 1 0;margin-left:8px">
    <div class="sent">⭐を <span class="stepper"><b>−</b><span class="val">10</span><b>＋</b></span> こ あつめたら クリア！</div></div></div>
  <div class="sep"></div>
  <div class="line">
    <div class="q" style="flex:0 0 auto">💣 さわったら おしまい</div>
    <div class="sw on"><span class="track"><span class="thumb"></span></span><span class="state">オン</span></div>
    <div class="line" style="gap:6px;margin-left:auto">${CH.map(c=>`<div class="ch${c.c==="c2"?" on":""}">${c.e}</div>`).join("")}</div>
  </div>
  <div class="line" style="margin-top:8px">
    <div class="q" style="flex:0 0 auto">🔢 スコアを だす</div>
    <div class="sw on"><span class="track"><span class="thumb"></span></span><span class="state">オン</span></div>
  </div>
</div>`;}

const BGN=["そうげん","ジャングル","だいち","アリーナ","スタジオ"];
function bgBig(){return `<div class="card"><div class="rowtitle">ぶたい（はいけい）</div>
  <div class="thumbs">${BGN.map((n,i)=>`<div class="th${i===0?" on":""}"><span>${n}</span></div>`).join("")}</div></div>`;}
function bgChip(){return `<div class="card"><div class="line" style="gap:7px">
  <div class="rowtitle" style="margin:0;flex:0 0 auto">ぶたい</div>
  <div class="chips">${BGN.map((n,i)=>`<div class="chip${i===0?" on":""}"><i></i>${n}</div>`).join("")}</div></div></div>`;}

function castV(){
  const t = S.cast==="long"
    ? "はいゆうひかえしつ（タップで とうじょう・けすときは ここへ ドラッグ・キャラは 5にんまで）"
    : "はいゆうひかえしつ（タップで とうじょう・5にんまで）";
  return `<div class="card"><div class="rowtitle">${t}</div>
    <div class="strip">${"🧒🐲🔥🗿💧🍄🐣👾🦀🐍".split(/(?:)/u).slice(0,10).map(e=>`<div class="cc">${e}</div>`).join("")}</div></div>`;
}

function render(){
  const w=Math.max(300,Math.round(window.innerWidth*0.40));
  $("right").style.width=w+"px";
  const cs=Math.max(8,Math.round((w-24)/12));
  $("grid").style.backgroundSize=cs+"px "+cs+"px";
  const cfg = S.cfg==="cur"?cfgCur():S.cfg==="p1"?cfgP1():cfgP1C();
  const bg  = S.bg==="big"?bgBig():bgChip();
  if(S.ord==="now"){ $("cfg").innerHTML=cfg; $("bg").innerHTML=bg; $("cast").innerHTML=castV(); }
  else { $("cfg").innerHTML=bg; $("bg").innerHTML=castV(); $("cast").innerHTML=cfg; }
  requestAnimationFrame(judge);
}
function judge(){
  const r=$("right");
  const avail=window.innerHeight-56-20;              // ヘッダー56 ＋ 上下padding20
  let used=0, parts=[];
  const th=$("th").getBoundingClientRect().height; used+=th; parts.push(["ぶたい(プレビュー)",th]);
  [["せってい枠","cfg"],["まんなか枠","bg"],["したの枠","cast"]].forEach(([n,id])=>{
    const h=$(id).getBoundingClientRect().height; if(h>2){used+=h; parts.push([n,h]);}
  });
  const over=Math.round(used-avail);
  const b=$("badge");
  b.className="badge "+(over<=0?"ok":"ng");
  b.innerHTML = (over<=0 ? `✅ 1がめんに おさまる<br>のこり ${-over}px` : `⚠️ ${over}px はみだす`)
    + `<small>がめん ${window.innerWidth}×${window.innerHeight}／つかえる たて ${avail}px<br>`
    + parts.map(([n,h])=>`${n} ${Math.round(h)}`).join("　") + `</small>`;
}
$("ctl").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]"); if(!b) return;
  S[b.dataset.k]=b.dataset.v;
  [...$("ctl").querySelectorAll(`button[data-k="${b.dataset.k}"]`)].forEach(x=>x.classList.toggle("on",x===b));
  render();
});
$("hd").onclick=()=>{ const c=$("ctl"); c.classList.toggle("hide");
  $("hd").textContent=c.classList.contains("hide")?"つまみを ひらく":"つまみを たたむ"; };
window.addEventListener("resize",render);
render();
</script>
</body>
</html>
